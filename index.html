<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>观文 · 古籍书房</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f0e7;color:#292d27;font:16px Georgia,'Songti SC',serif}header,main,footer{max-width:1180px;margin:auto;padding:28px}header{display:flex;justify-content:space-between;border-bottom:1px solid #cfcaba}a{color:inherit}h1{font-size:70px;font-weight:400;margin:25px 0}small,.muted{color:#77796e}section.hero{padding:65px 0 55px;display:grid;grid-template-columns:2fr 1fr;gap:40px}.seal{background:#903d30;color:#fff;width:160px;height:210px;display:grid;place-content:center;font-size:45px;writing-mode:vertical-rl;justify-self:center;border:5px double #eadbc3}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:25px 0}input{flex:1;min-width:220px;padding:14px;background:transparent;border:1px solid #bbb7a6;font:inherit}button{cursor:pointer;padding:12px 20px;border:1px solid #bbb7a6;background:transparent;color:inherit;font:inherit}button.active,button:hover{background:#344a3c;color:white}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.book{padding:30px;background:#fffdf7;border:1px solid #d8d2c3;min-height:240px}.book h2{font-weight:400;font-size:30px}.book button{margin-top:15px}footer{margin-top:60px;border-top:1px solid #cfcaba;color:#77796e}dialog{max-width:760px;width:90%;background:#fffdf7;border:1px solid #bcb4a2;padding:35px}dialog::backdrop{background:#14221888}dialog p{line-height:2;font-size:21px;white-space:pre-line}@media(max-width:700px){h1{font-size:45px}section.hero{grid-template-columns:1fr;padding-top:35px}.seal{display:none}.grid{grid-template-columns:1fr}header,main,footer{padding:20px}}</style><header><strong>觀文 GUANWEN</strong><a href="#library">进入书房 ↗</a></header><main><section class="hero"><div><small>古籍书房 / CLASSICAL LIBRARY</small><h1>翻开一卷，<br>与古人相遇。</h1><p class="muted">从经史子集之间，读见思想、山川与日常。<br>一处安静的阅读空间，留给今天的你。</p><a href="#library">浏览典籍 ↓</a></div><div class="seal">觀文書房</div></section><section id="library"><small>书架 / 选读六种</small><div class="tools"><input id="search" aria-label="搜索典籍" placeholder="搜索书名、作者或关键词"><div id="filters"></div></div><div class="grid" id="books"></div><p id="empty" hidden>暂无匹配典籍，请尝试其他关键词。</p></section></main><footer>观文 · 古籍书房　｜　本站提供经典节选，供入门阅读。</footer><dialog id="reader"><button id="close">关闭 ×</button><h2 id="title"></h2><small id="author"></small><p id="text"></p></dialog><script>const data=[['论语','孔子及其弟子','经','学而','子曰：学而时习之，不亦说乎？有朋自远方来，不亦乐乎？人不知而不愠，不亦君子乎？'],['史记','司马迁','史','太史公自序','究天人之际，通古今之变，成一家之言。'],['道德经','老子','子','第一章','道可道，非常道。名可名，非常名。无名天地之始；有名万物之母。'],['庄子','庄周','子','逍遥游','北冥有鱼，其名为鲲。鲲之大，不知其几千里也；化而为鸟，其名为鹏。'],['诗经','佚名','经','关雎','关关雎鸠，在河之洲。窈窕淑女，君子好逑。'],['陶渊明集','陶渊明','集','饮酒·其五','结庐在人境，而无车马喧。\n问君何能尔？心远地自偏。\n采菊东篱下，悠然见南山。\n山气日夕佳，飞鸟相与还。\n此中有真意，欲辨已忘言。']];let category='全部';const filters=document.querySelector('#filters');['全部','经','史','子','集'].forEach(c=>{const b=document.createElement('button');b.textContent=c;b.onclick=()=>{category=c;render()};filters.append(b)});function render(){document.querySelectorAll('#filters button').forEach(b=>b.classList.toggle('active',b.textContent===category));const q=document.querySelector('#search').value.trim();const list=data.filter(b=>(category==='全部'||b[2]===category)&&b.join('').includes(q));document.querySelector('#books').replaceChildren(...list.map(b=>{const el=document.createElement('article');el.className='book';const tag=document.createElement('small');tag.textContent=b[2]+'部 · '+b[1];const h=document.createElement('h2');h.textContent=b[0];const p=document.createElement('p');p.textContent=b[3]+' · 经典节选';const btn=document.createElement('button');btn.textContent='打开阅读 ↗';btn.onclick=()=>{document.querySelector('#title').textContent=b[0]+' · '+b[3];document.querySelector('#author').textContent=b[1]+' / 节选';document.querySelector('#text').textContent=b[4];document.querySelector('#reader').showModal()};el.append(tag,h,p,btn);return el}));document.querySelector('#empty').hidden=!!list.length}document.querySelector('#search').oninput=render;document.querySelector('#close').onclick=()=>document.querySelector('#reader').close();render();</script></html>
